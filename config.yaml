# ETF bot configuration. Freeze strategy parameters BEFORE out-of-sample testing.
# Changing a parameter after seeing results invalidates the test.

mode: paper            # paper | live. Real-money brokers also need broker.allow_real_money + per-order approval

# Broker used by `python -m etfbot trade`. (`python -m etfbot paper` always uses the built-in simulator.)
# t212_demo | t212_live | ibkr_paper | ibkr_live
broker:
  name: t212_demo
  allow_real_money: false
  quantity_decimals: 2     # Trading 212 fractional shares; IBKR always whole shares
  ibkr_host: 127.0.0.1
  ibkr_port: 7497          # 7497 = TWS paper, 7496 = TWS live
  ibkr_client_id: 1

account:
  starting_equity_gbp: 5000
  base_trade_size_gbp: 1000     # max value of any single order

# Five sleeves. `ucits` is the instrument traded live (Yahoo ticker).
# `proxy` provides history before the UCITS fund existed, so backtests cover 2008.
# Proxy weights must sum to 1. `fx_to_gbp: true` converts USD proxy returns to GBP.
# `ucits_currency` (default GBP) is the currency the UCITS line is QUOTED in; USD lines are converted too.
instruments:
  GLOBAL_EQ:
    ucits: SWDA.L
    price_scale: 0.01        # VERIFY: 0.01 if Yahoo quotes this line in pence (GBp), 1.0 if in pounds
    t212_ticker: null        # VERIFY: Trading 212 ticker, e.g. from `get_instruments()`
    ibkr: null               # VERIFY: {symbol: ..., exchange: LSEETF, currency: GBP}
    proxy: {SPY: 0.65, EFA: 0.35}   # rough MSCI World stand-in
    fx_to_gbp: true
  US_EQ:
    ucits: CSPX.L
    ucits_currency: USD      # VERIFY: CSPX is believed to be the USD-quoted line; returns are converted to GBP
    price_scale: 0.01        # VERIFY: 0.01 if Yahoo quotes this line in pence (GBp), 1.0 if in pounds
    t212_ticker: null        # VERIFY: Trading 212 ticker, e.g. from `get_instruments()`
    ibkr: null               # VERIFY: {symbol: ..., exchange: LSEETF, currency: GBP}
    proxy: {SPY: 1.0}
    fx_to_gbp: true
  BONDS:
    ucits: VAGS.L                   # GBP-hedged global aggregate
    price_scale: 0.01        # VERIFY: 0.01 if Yahoo quotes this line in pence (GBp), 1.0 if in pounds
    t212_ticker: null        # VERIFY: Trading 212 ticker, e.g. from `get_instruments()`
    ibkr: null               # VERIFY: {symbol: ..., exchange: LSEETF, currency: GBP}
    proxy: {AGG: 1.0}               # USD aggregate; hedged fund ~ local return, so no FX
    fx_to_gbp: false
  GOLD:
    ucits: SGLN.L
    price_scale: 0.01        # VERIFY: 0.01 if Yahoo quotes this line in pence (GBp), 1.0 if in pounds
    t212_ticker: null        # VERIFY: Trading 212 ticker, e.g. from `get_instruments()`
    ibkr: null               # VERIFY: {symbol: ..., exchange: LSEETF, currency: GBP}
    proxy: {GLD: 1.0}
    fx_to_gbp: true
  EM_EQ:
    ucits: EMIM.L
    price_scale: 0.01        # VERIFY: 0.01 if Yahoo quotes this line in pence (GBp), 1.0 if in pounds
    t212_ticker: null        # VERIFY: Trading 212 ticker, e.g. from `get_instruments()`
    ibkr: null               # VERIFY: {symbol: ..., exchange: LSEETF, currency: GBP}
    proxy: {EEM: 1.0}
    fx_to_gbp: true

fx_ticker: GBPUSD=X
data:
  start: "2004-01-01"
  cache_dir: data
  source: yahoo            # yahoo | csv. If Yahoo downloads stop working, put CSVs in csv_dir (see README)
  csv_dir: data/manual

strategies:
  trend:
    enabled: true
    sma_days: 200          # hold sleeve while price > 200-day SMA
    check: weekly          # signals evaluated on the last trading day of each week
  rotation:
    enabled: false         # research only until trend clears the paper gate
    lookback_days: 126
    top_n: 3
    absolute_filter: true  # only hold assets with positive momentum
  dip:
    enabled: false
    drop_pct: 0.05         # 5-day drop that triggers entry
    lookback_days: 5
    trend_sma_days: 200    # only buy dips while above this SMA
    exit_sma_days: 5       # exit when price closes above this SMA
    sleeves: [GLOBAL_EQ, US_EQ, EM_EQ, GOLD]

  # --- Discovery candidates. Parameters frozen 2026-11-04, BEFORE any real-data test. ---
  # Do not tune these after seeing results; add a new, separately-named candidate instead.
  faber:                   # Faber 10-month trend filter, monthly check
    enabled: false
    months: 10
  dual_momentum:           # Antonacci-style relative + absolute momentum, monthly
    enabled: false
    lookback_days: 252
    top_n: 3
    safe: BONDS
  inverse_vol:             # always invested, weights ~ 1/volatility, monthly
    enabled: false
    vol_days: 63
  trend_inverse_vol:       # inverse-vol weights, sleeves below 200-day SMA go to cash, weekly
    enabled: false
    sma_days: 200
    vol_days: 63
  trend_voltarget:         # trend, scaled down when portfolio vol > target (no leverage), weekly
    enabled: false
    sma_days: 200
    target_vol: 0.08
    lookback_days: 63
  # Added 2026-11-04 (also frozen before any real-data test), from published research:
  tsmom:                   # time-series momentum: hold while own 12-month return > 0, monthly
    enabled: false
    lookback_days: 252
  sma_cross:               # 50/200-day moving-average crossover, weekly
    enabled: false
    fast_days: 50
    slow_days: 200
  turn_of_month:           # hold last trading day of month to 3rd trading day of next, else cash
    enabled: false
    days_before: 1
    days_after: 3
  rsi2:                    # Connors 2-day RSI mean reversion inside a 200-day uptrend
    enabled: false
    entry_below: 10.0
    trend_sma_days: 200
    exit_sma_days: 5
  # Added 2026-11-04 from Quantpedia's free strategies (frozen before any real-data test):
  pre_holiday:             # hold only on the trading day before a market holiday
    enabled: false
  options_expiry_week:     # hold during the week containing the month's third Friday
    enabled: false
  calendar_composite:      # turn-of-month (last 4 / first 3 days) OR pre-holiday OR opex week, only above 200-day SMA
    enabled: false
    trend_sma_days: 200
    tom_before: 4
    tom_after: 3
  blend:                   # set by `combine`: equal-weight average of up to 3 strategies on one ETF
    enabled: false
    components: [trend, faber, tsmom]

costs:
  spread_bps: 10           # half-spread + slippage per side, in basis points
  commission_gbp: 0.0      # per order (Trading 212 ETFs ~0; IBKR set your value)
  fx_fee_bps: 15           # applied to USD-listed trades only (not used for GBP lines)
  cash_rate: 0.0           # annual return on idle cash in backtests (conservative)

discovery:
  candidates: [trend, faber, rotation, dual_momentum, inverse_vol, trend_inverse_vol, trend_voltarget,
               tsmom, sma_cross, turn_of_month, rsi2, pre_holiday, options_expiry_week, calendar_composite]
  deflated_sharpe_min: 0.95   # probability the best OOS Sharpe is real, after correcting for the number tried
  timemachine_paths: 2000

backtest:
  oos_start: "2016-01-01"  # results after this date are the out-of-sample test
  stress_periods:
    gfc_2008: ["2007-10-01", "2009-03-31"]
    covid_2020: ["2020-02-01", "2020-06-30"]
    rates_2022: ["2022-01-01", "2022-12-31"]

risk:
  max_position_frac: 0.30      # no sleeve above 30% of equity
  max_order_gbp: 10000         # absolute ceiling per order; the working cap starts at base_trade_size_gbp and scales
  max_orders_per_day: 5
  drawdown_pause_frac: 0.15    # pause new buys if equity falls 15% from peak
  kill_switch_file: state/KILL # if this file exists, nothing trades

scaling:                       # order-size cap = base_trade_size_gbp x multiplier (see etfbot/scaling.py)
  review_weeks: 8              # review every 8 weeks
  step_up_frac: 0.10           # +10% to the order cap after a good review
  step_down_frac: 0.10         # -10% after a review where the drawdown pause was hit (never below 1.0x)
  max_drawdown_for_step_up: 0.075   # only step up if the account is less than 7.5% below its peak
  max_multiplier: 10.0         # at most 10x the base size (also limited by risk.max_order_gbp)
  step_down_on_drawdown: true

paths:
  state_dir: state
  log_dir: logs

search:                     # ETF strategy search (python -m etfbot search ...); rules fixed before any run
  discovery: ["2005-01-01", "2012-12-31"]
  validation: [["2013-01-01", "2016-12-31"], ["2017-01-01", "2020-12-31"]]
  holdout_start: "2021-01-01"        # untouched until the shortlist is frozen
  cost_bps: 5                        # per unit of weight traded, fees + slippage
  stress_cost_multipliers: [2, 3]
  max_cagr_giveup: 0.02              # may lag the matched benchmark by at most 2%/yr...
  require_lower_drawdown: true       # ...and must have a smaller max drawdown, in every period
  samples: 3000
  seed: 42
  shortlist_size: 25
  max_per_family_universe: 3
  neighbour_mar_floor: 0.5           # a neighbour scoring below 50% of the candidate's worst-period MAR = sensitive

daytrade:                   # intraday strategy search (python -m etfbot daytrade ...); rules fixed 2026-11-05 before any run
  datasets:                 # name: [file, timeframe minutes, cost bps per side, session end hour UTC for end-of-day exits]
    XAUUSD_1h: ["/mnt/user-data/uploads/backtestbot/data/XAUUSD_H1_2016_2026.csv", 60, 3.0, 21]
    BTCUSDT_1h: ["data/crypto_h1/BTCUSDT_H1.csv", 60, 5.0, 24]
    BTCUSDT_15m: ["data/crypto_h1/BTCUSDT_15m.pkl", 15, 5.0, 24]
    BTCUSDT_5m: ["data/crypto_h1/BTCUSDT_5m.pkl", 5, 5.0, 24]
    ETHUSDT_1h: ["data/crypto_h1/ETHUSDT_H1.csv", 60, 5.0, 24]
    ETHUSDT_15m: ["data/crypto_h1/ETHUSDT_15m.pkl", 15, 5.0, 24]
    ETHUSDT_5m: ["data/crypto_h1/ETHUSDT_5m.pkl", 5, 5.0, 24]
  discovery_end: "2020-12-31"           # discovery = start of data to here
  validation: [["2021-01-01", "2022-12-31"], ["2023-01-01", "2024-12-31"]]
  holdout_start: "2025-01-01"           # untouched until the shortlist is frozen
  min_sharpe: 0.5                       # net of costs, in discovery AND every validation fold
  min_profit_factor: 1.05
  min_trades_per_week: 5.0              # user goal: 1-2 trades a day (raised 2026-11-05 08:20, before the first full run)
  stress_cost_multipliers: [2, 3]
  samples: 4000
  seed: 7
  shortlist_size: 25
  max_per_dataset_family: 3
